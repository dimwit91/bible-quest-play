    <title>Bible Quest</title>
    
    <link rel="stylesheet" crossorigin href="./assets/index-DRMNA-bE.css">
  <style>#bq-gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(#8fd3ff,#f7e4b5);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#4a3420;padding:16px}
#bq-gate .card{background:#fff8e6;border:4px solid #6b4a2f;border-radius:22px;padding:28px 24px;max-width:440px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#bq-gate h1{margin:4px 0 4px;font-size:2.2rem}
#bq-gate p{margin:6px 0 16px}
#bq-gate .sun{font-size:3rem}
#bq-gate input{width:100%;box-sizing:border-box;font-size:1.3rem;padding:12px;border-radius:12px;border:3px solid #c9a46b;text-align:center;margin-bottom:12px}
#bq-gate button{font-size:1.25rem;font-weight:700;padding:14px 18px;border-radius:14px;border:3px solid #6b4a2f;background:#f2c14e;color:#4a3420;cursor:pointer;width:100%}
#bq-gate button:disabled{opacity:.6}
#bq-gate .err{color:#b3261e;min-height:1.4em;font-weight:600}
#bq-gate .profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
#bq-gate .profiles button{background:#fff;padding:18px 8px}
#bq-gate .profiles .emoji{display:block;font-size:2.4rem}
#bq-gate .remember{display:flex;gap:8px;align-items:center;justify-content:center;margin:0 0 12px;font-size:.95rem}
#bq-gate .remember input{width:auto;margin:0}
#bq-switch{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:50;font:600 13px system-ui,sans-serif;background:rgba(255,248,230,.9);color:#4a3420;border:2px solid #6b4a2f;border-radius:999px;padding:6px 12px;cursor:pointer}
#bq-gate button.ghost{background:transparent;border-color:#c9a46b;margin-top:8px;font-size:1rem;padding:8px}
</style>
</head>
  <body>
    <canvas id="game" aria-label="Bible Quest game world"></canvas>
    <div id="ui"></div>
    <noscript>Bible Quest needs JavaScript to run.</noscript>
  <script>window.__BQ_GATE__={"file":"./assets/game-543a8222.bin","salt":"bXGdL8eXI6C/MWdj8AJY2g==","iterations":250000,"profiles":[{"id":"jude","name":"Jude","emoji":"🦁"},{"id":"jaxon","name":"Jaxon","emoji":"🐑"},{"id":"noya","name":"Noya","emoji":"🕊️"}]};</script>
<script>// Bible Quest family login. The game code ships encrypted (AES-GCM, key from the
// family password via PBKDF2), so it only runs after the right password is entered.
(() => {
  const CFG = window.__BQ_GATE__;
  const KEY_STORE = 'bq-family-key-v1';
  const root = document.createElement('div');
  root.id = 'bq-gate';
  document.body.append(root);
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const h = (tag, props = {}, ...kids) => {
    const e = Object.assign(document.createElement(tag), props);
    e.append(...kids);
    return e;
  };
  let payload = null;
  const getPayload = async () => {
    if (!payload) {
      const r = await fetch(CFG.file, { cache: 'no-cache' });
      if (!r.ok) throw new Error('download failed');
      payload = new Uint8Array(await r.arrayBuffer());
    }
    return payload;
  };
  const decrypt = async (key) => {
    const data = await getPayload();
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12));
  };
  const deriveKey = async (password) => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', hash: 'SHA-256', salt: unb64(CFG.salt), iterations: CFG.iterations },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  };
  const card = (...kids) => { root.replaceChildren(h('div', { className: 'card' }, ...kids)); };

  function showPassword(msg = '') {
    const input = h('input', { type: 'password', placeholder: 'Family password', autocomplete: 'current-password', id: 'bq-password' });
    const remember = h('input', { type: 'checkbox', checked: true, id: 'bq-remember' });
    const err = h('div', { className: 'err', textContent: msg });
    const btn = h('button', { textContent: 'Unlock', id: 'bq-unlock', type: 'submit' });
    const form = h('form', {}, input, h('label', { className: 'remember' }, remember, 'Remember this device'), btn, err);
    form.onsubmit = async (ev) => {
      ev.preventDefault();
      if (!input.value.trim()) return;
      btn.disabled = true; btn.textContent = 'Checking...'; err.textContent = '';
      try {
        const key = await deriveKey(input.value);
        const code = await decrypt(key);
        if (remember.checked) localStorage.setItem(KEY_STORE, b64(await crypto.subtle.exportKey('raw', key)));
        showProfiles(code);
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Unlock';
        err.textContent = String(e && e.message).includes('download') ? 'Could not load the game. Check the internet and try again.' : 'That password is not right. Try again!';
        input.select();
      }
    };
    card(h('div', { className: 'sun', textContent: '☀️' }), h('h1', { textContent: 'Bible Quest' }),
      h('p', { textContent: 'Type the family password to start.' }), form);
    input.focus();
  }

  function showProfiles(code) {
    const grid = h('div', { className: 'profiles' });
    for (const p of CFG.profiles) {
      const b = h('button', { type: 'button', id: `bq-profile-${p.id}` }, h('span', { className: 'emoji', textContent: p.emoji || '🙂' }), p.name);
      b.onclick = () => showKid(code, p);
      grid.append(b);
    }
    card(h('div', { className: 'sun', textContent: '☀️' }), h('h1', { textContent: 'Who is playing?' }),
      h('p', { textContent: 'Everyone has their own saved adventure.' }), grid);
  }

  function showKid(code, p, msg = '') {
    const input = h('input', { type: 'password', placeholder: 'Type your name', autocomplete: 'off', autocapitalize: 'none', id: 'bq-kid-password' });
    const err = h('div', { className: 'err', textContent: msg });
    const btn = h('button', { textContent: "Let's go!", id: 'bq-kid-go', type: 'submit' });
    const back = h('button', { textContent: 'Back', id: 'bq-kid-back', type: 'button', className: 'ghost' });
    back.onclick = () => showProfiles(code);
    const form = h('form', {}, input, btn, err, back);
    form.onsubmit = (ev) => {
      ev.preventDefault();
      if (input.value.trim().toLowerCase() === p.id.toLowerCase()) return start(code, p);
      err.textContent = 'Not quite. Type your name to play!';
      input.select();
    };
    card(h('div', { className: 'sun', textContent: p.emoji || '🙂' }), h('h1', { textContent: `Hi ${p.name}!` }),
      h('p', { textContent: 'Type your name to get back to your game.' }), form);
    input.focus();
  }

  async function start(code, p) {
    window.__BQ_PROFILE__ = { id: p.id, name: p.name };
    root.remove();
    const sw = h('button', { id: 'bq-switch', textContent: `👤 ${p.name} · Switch player` });
    sw.onclick = () => location.reload();
    document.body.append(sw);
    const url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    await import(url);
  }

  (async () => {
    const saved = localStorage.getItem(KEY_STORE);
    if (saved) {
      try {
        const key = await crypto.subtle.importKey('raw', unb64(saved), 'AES-GCM', true, ['decrypt']);
        return showProfiles(await decrypt(key));
      } catch {
        localStorage.removeItem(KEY_STORE); // password changed since last visit
      }
    }
    showPassword();
  })();
})();
</script>
</body>
</html>
